name: Build

on:
  push:
    branches: [ main, develop, "feature/**", "claude/**", "fix/**" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build SkyOS Core
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Use actions/cache directly instead of gradle/actions/setup-gradle.
      # The Gradle-specific cache service returns HTTP 400 on this runner
      # environment, which crashes the setup action and leaves gradle absent
      # from PATH. actions/cache uses the standard GitHub cache service which
      # works correctly.
      - name: Cache Gradle user home
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('skyos-core/**/*.gradle*', 'skyos-core/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Download Gradle from the official distribution. This is completely
      # independent of any CI caching service and is always reliable.
      - name: Install Gradle 8.10.2
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.10.2-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.10.2/bin" >> $GITHUB_PATH

      - name: Verify Gradle installation
        run: gradle --version

      # Build directly with the installed Gradle — no wrapper needed.
      # Running `gradle wrapper` inside skyos-core triggers a full project
      # initialisation (Loom download, plugin resolution) before it can
      # write the wrapper files, which reliably fails on this runner.
      # The installed Gradle 8.10.2 is equivalent to running ./gradlew;
      # skipping the wrapper removes an entire class of failure.
      - name: Build SkyOS Core
        working-directory: skyos-core
        run: gradle build --no-daemon --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skyos-core-${{ github.sha }}
          path: skyos-core/build/libs/*.jar
          retention-days: 14

      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-failure-${{ github.sha }}
          path: skyos-core/build/reports/
          retention-days: 7

